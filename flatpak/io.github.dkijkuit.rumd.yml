app-id: io.github.dkijkuit.rumd
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: rumd
finish-args:
  - --socket=wayland
  - --socket=x11
  - --share=ipc
  - --device=dri
  - --filesystem=host
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  build-args:
    - --share=network
  env:
    CARGO_HOME: /run/build/rumd/cargo
modules:
  - name: rumd
    buildsystem: simple
    build-commands:
      - cargo build --release
      - install -Dm755 target/release/rumd /app/bin/rumd
      - install -Dm644 flatpak/io.github.dkijkuit.rumd.desktop /app/share/applications/io.github.dkijkuit.rumd.desktop
      - install -Dm644 flatpak/io.github.dkijkuit.rumd.metainfo.xml /app/share/metainfo/io.github.dkijkuit.rumd.metainfo.xml
      - install -Dm644 flatpak/icons/128x128/io.github.dkijkuit.rumd.png /app/share/icons/hicolor/128x128/apps/io.github.dkijkuit.rumd.png
    sources:
      - type: dir
        path: ..

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-14
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-14
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          NAME="rumd-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$NAME"
          cp "target/${{ matrix.target }}/release/rumd" "$NAME"/
          cp README.md "$NAME"/
          tar czf "$NAME.tar.gz" "$NAME"
          if command -v sha256sum >/dev/null; then
            sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
          else
            shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
          fi
      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $name = "rumd-$($env:GITHUB_REF_NAME)-${{ matrix.target }}"
          New-Item -ItemType Directory "$name"
          Copy-Item "target/${{ matrix.target }}/release/rumd.exe" "$name/"
          Copy-Item "README.md" "$name/"
          Compress-Archive -Path "$name" -DestinationPath "$name.zip"
          (Get-FileHash -Algorithm SHA256 "$name.zip").Hash.ToLower() + "  $name.zip" |
            Set-Content "$name.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.target }}
          path: |
            rumd-*.tar.gz
            rumd-*.tar.gz.sha256
            rumd-*.zip

  flatpak:
    # Needs flatpak-builder >= 1.4: it runs appstream compose host-side
    # (appstreamcli), while 1.2.x (jammy) execs appstream-compose inside the
    # SDK sandbox and freedesktop Sdk 26.08 no longer ships that binary.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install flatpak-builder and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Build
        run: |
          flatpak-builder --user --install-deps-from=flathub --force-clean \
            --state-dir .flatpak-builder-state --repo=fp-repo dist \
            flatpak/io.github.dkijkuit.rumd.yml
      - name: Bundle
        run: |
          flatpak build-bundle fp-repo "rumd-${GITHUB_REF_NAME}.flatpak" io.github.dkijkuit.rumd
      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-flatpak
          path: rumd-*.flatpak

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
          body: |
            Unpack the archive for your platform and run the `rumd` binary.

            - **Linux** needs the X11/Wayland client libraries at runtime
              (`libxkbcommon`, `libwayland-client`, `libX11`), which most
              desktops already have.
            - **macOS**: the binary is unsigned — if Gatekeeper blocks it,
              run `xattr -cr rumd` once, or right-click → Open.
            - **Windows**: SmartScreen may warn on first run —
              "More info" → "Run anyway".

  website-version:
    # Stamp the released tag into the website, commit it to main, and deploy
    # the site. The deploy steps live here because pushes made with
    # GITHUB_TOKEN do not trigger the Pages workflow.
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Stamp release version into the website
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          OLD="$(grep -oE 'rumd-version: [0-9.]+' website/index.html | awk '{print $2}')"
          if [ -z "$OLD" ]; then
            echo "::error::rumd-version marker not found in website/index.html"
            exit 1
          fi
          if [ "$OLD" = "$TAG" ]; then
            echo "Website already at v$TAG"
          else
            sed -i "s/v${OLD}/v${TAG}/g" website/index.html
            sed -i -E "s/(rumd-version: )[0-9.]+/\1${TAG}/" website/index.html
            if ! grep -q "v${TAG}" website/index.html; then
              echo "::error::version stamp failed"
              exit 1
            fi
          fi
      - name: Commit stamped version to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/index.html
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "chore: website version ${GITHUB_REF_NAME}"
            git push origin main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v4
